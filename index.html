<script>
'use strict';
const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const num = n => new Intl.NumberFormat('id-ID').format(n||0);
const escapeHtml = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, cls='') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const labelStatus = {synced:'Sinkron', approved:'Siap dikirim', pending:'Menunggu approval', blocked:'Tertahan',failed:'Gagal sinkron',received:'Baru diterima'};
const nowIso=()=>new Date().toISOString();
const sampleLines=()=>[{product:'PET',qty:6500,unitPrice:5000,po:true},{product:'HDPE',qty:3200,unitPrice:2500,po:true},{product:'Residu',qty:700,unitPrice:0,po:false}];
function makeTx(id,ref,status,options={}) {const base={id,ref,vendor:'PT Contoh Material',date:'2026-09-23',lot:'LOT-260923',gross:18600,tare:8200,lines:sampleLines(),source:'Vendor ABC',batch:'BATCH-260923-01',vendorApproved:false,pwpApproved:false,po:null,simFail:false,retried:false,checks:[],events:[],status};return Object.assign(base,options)}
const seedTx=[
  makeTx('TRX-001','VABC-260923-001','synced',{po:'PO-DEMO-0042',vendorApproved:true,pwpApproved:true,events:[{at:'09:04',by:'Vendor ABC',text:'Data penimbangan diterima'},{at:'09:05',by:'Middleware',text:'Validasi berhasil — mapping lengkap'},{at:'09:10',by:'Vendor ABC + PWP',text:'Kedua pihak menyetujui data final'},{at:'09:11',by:'Odoo Simulator',text:'PO-DEMO-0042 berhasil dibuat'}]}),
  makeTx('TRX-002','VABC-260923-002','pending',{lot:'LOT-260923-B',gross:11200,tare:5400,lines:[{product:'PET',qty:4000,unitPrice:5000,po:true},{product:'HDPE',qty:1400,unitPrice:2500,po:true},{product:'Residu',qty:400,unitPrice:0,po:false}],batch:'BATCH-260923-02',vendorApproved:true,events:[{at:'10:12',by:'Vendor ABC',text:'Transaksi sortir diterima'},{at:'10:13',by:'Middleware',text:'Validasi berhasil'},{at:'10:20',by:'Vendor ABC',text:'Data final dikonfirmasi'}]}),
  makeTx('TRX-003','VABC-260923-003','blocked',{lot:'LOT-260923-C',gross:16000,tare:6000,lines:[{product:'PET',qty:6000,unitPrice:5000,po:true},{product:'HDPE',qty:3100,unitPrice:2500,po:true},{product:'Residu',qty:500,unitPrice:0,po:false}],batch:'BATCH-260923-03',events:[{at:'11:21',by:'Vendor ABC',text:'Transaksi diterima'},{at:'11:22',by:'Middleware',text:'Ditahan: selisih berat 400 kg'}]}),
  makeTx('TRX-004','VABC-260923-004','failed',{lot:'LOT-260923-D',gross:10600,tare:5200,lines:[{product:'PET',qty:3200,unitPrice:5000,po:true},{product:'HDPE',qty:1900,unitPrice:2500,po:true},{product:'Residu',qty:300,unitPrice:0,po:false}],batch:'BATCH-260923-04',vendorApproved:true,pwpApproved:true,simFail:true,events:[{at:'13:41',by:'Middleware',text:'Validasi dan persetujuan berhasil'},{at:'13:42',by:'Odoo Simulator',text:'Respons 503 (simulasi) — aman untuk retry'}]})
];
const pristineSeed=JSON.parse(JSON.stringify(seedTx));
let state={page:'dashboard',selected:'TRX-001',transactions:seedTx,seq:5,search:'',filter:'all',scenario:'normal',logs:seedTx.flatMap(t=>t.events.map(e=>({tx:t.id,ref:t.ref,...e}))).reverse(),modal:false};
function tx() {return state.transactions.find(t=>t.id===state.selected)||state.transactions[0]}
function time(){return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
function totalQty(t){return t.lines.reduce((s,l)=>s+Number(l.qty||0),0)}
function purchasedQty(t){return t.lines.filter(l=>l.po).reduce((s,l)=>s+Number(l.qty||0),0)}
function poAmount(t){return t.lines.filter(l=>l.po).reduce((s,l)=>s+Number(l.qty||0)*Number(l.unitPrice||0),0)}
function net(t){return Number(t.gross)-Number(t.tare)}
function delta(t){return totalQty(t)-net(t)}
function addLog(t,text,by='Middleware'){const e={tx:t.id,ref:t.ref,at:time(),by,text};t.events.push({at:e.at,by:e.by,text:e.text});state.logs.unshift(e)}
function badge(s){return `<span class="status ${s}">${labelStatus[s]||s}</span>`}
function shortDate(d){return (d||'').split('-').reverse().join('/')}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),3300)}
function toggleMenu(on){document.getElementById('sidebar').classList.toggle('open',on);document.getElementById('veil').classList.toggle('show',on)}
function goto(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));toggleMenu(false);render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.page)));
function heading(k,title,desc,buttons=''){return `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
const btnSimulator=`<button class="btn primary" onclick="openSimulator()">${icon('plus')} Simulasi transaksi</button>`;
function render(){const names={dashboard:'Overview',transactions:'Transaksi Timbang',validation:'Validasi & Approval',integration:'Integrasi Odoo',audit:'Audit Trail',configuration:'Data Mapping'};document.getElementById('breadcrumb').textContent=names[state.page];document.getElementById('navCount').textContent=state.transactions.length;document.getElementById('page').innerHTML=({dashboard:pageDashboard,transactions:pageTransactions,validation:pageValidation,integration:pageIntegration,audit:pageAudit,configuration:pageConfig})[state.page]();}
function pageDashboard(){const ts=state.transactions;let synced=ts.filter(t=>t.status==='synced').length,pending=ts.filter(t=>['pending','approved','received'].includes(t.status)).length,problem=ts.filter(t=>['blocked','failed'].includes(t.status)).length;return `
${heading('PROJECT PWP / CONTROL CENTER','Semua transaksi, satu kendali.','Pantau alur penimbangan, sortir, validasi dan integrasi Odoo 16 dari satu dashboard. Semua data di halaman ini merupakan simulasi.',`<button class="btn" onclick="resetDemo()">↻ Reset demo</button>${btnSimulator}`)}
<div class="grid kpis">
 <article class="card kpi"><span class="kpi-lbl">Total transaksi</span><span class="icon-box">${icon('stack')}</span><div class="kpi-num num">${num(ts.length)}</div><div class="kpi-note">Dari simulator Vendor ABC</div></article>
 <article class="card kpi"><span class="kpi-lbl">Berhasil sinkron</span><span class="icon-box greenbox">${icon('check')}</span><div class="kpi-num num">${synced}</div><div class="kpi-note">PO demo tercatat</div></article>
 <article class="card kpi"><span class="kpi-lbl">Menunggu tindakan</span><span class="icon-box amberbox">${icon('clock')}</span><div class="kpi-num num">${pending}</div><div class="kpi-note">Validasi / persetujuan / kirim</div></article>
 <article class="card kpi"><span class="kpi-lbl">Perlu perhatian</span><span class="icon-box redbox">${icon('shield')}</span><div class="kpi-num num">${problem}</div><div class="kpi-note">Tertahan atau gagal sinkron</div></article>
</div>
<section class="hero"><div class="hero-header"><div><span class="hero-kicker">END-TO-END DATA FLOW</span><h2>Dari timbangan menjadi PO di Odoo.</h2><p>Gatekeeper untuk memeriksa dan menyetujui transaksi sebelum masuk ERP.</p></div><span class="pill" style="background:#ffffff17;color:#b5e7f8;align-self:start;border:1px solid #ffffff2b">${icon('shield')} Controlled workflow</span></div>
 <div class="flow"><div class="flow-node"><span class="flow-icon">${icon('truck')}</span><div><strong>Jembatan timbang</strong><span>Gross · Tare · Net</span></div></div><div class="flow-node"><span class="flow-icon">${icon('filter')}</span><div><strong>Timbangan sortir</strong><span>Produk · Lot · kg</span></div></div><div class="flow-node"><span class="flow-icon">${icon('shield')}</span><div><strong>Validasi</strong><span>Mapping · Selisih · Duplikat</span></div></div><div class="flow-node"><span class="flow-icon">${icon('check')}</span><div><strong>Approval dua pihak</strong><span>Vendor ABC · PWP</span></div></div><div class="flow-node"><span class="flow-icon">${icon('sync')}</span><div><strong>Odoo 16</strong><span>PO · Respons · Audit</span></div></div></div>
</section>
<div class="grid twocol"><section class="card"><div class="card-header"><div><h3>Transaksi terbaru</h3><p>Pilih baris untuk melihat detail transaksi dan tahapan proses.</p></div><button class="btn small flat" onclick="goto('transactions')">Lihat semua ${icon('arrow')}</button></div><div class="table-wrap"><table class="tbl"><thead><tr><th>ID / Referensi</th><th>Vendor</th><th>Net (kg)</th><th>Status</th><th></th></tr></thead><tbody>${ts.slice().reverse().slice(0,5).map(t=>`<tr onclick="openTx('${t.id}')"><td><span class="id">${escapeHtml(t.id)}</span><span class="minor">${escapeHtml(t.ref)}</span></td><td>${escapeHtml(t.vendor)}</td><td class="num">${num(net(t))}</td><td>${badge(t.status)}</td><td>${icon('chevron')}</td></tr>`).join('')}</tbody></table></div></section>
<section class="card"><div class="card-header"><div><h3>Aktivitas terakhir</h3><p>Jejak peristiwa dari setiap transaksi demo.</p></div><button class="btn small flat" onclick="goto('audit')">Semua log ${icon('arrow')}</button></div><div class="card-body">${state.logs.slice(0,5).map(e=>`<div class="event"><div class="event-icon">${icon(e.by==='Odoo Simulator'?'sync':'logs')}</div><div><b>${escapeHtml(e.text)}</b><p>${escapeHtml(e.tx)} · ${escapeHtml(e.by)}</p></div><time>${escapeHtml(e.at)}</time></div>`).join('')}</div></section></div>
<div class="callout"><strong>Catatan presentasi:</strong> Grafik, transaksi, vendor, harga, nilai PO, respons API, persetujuan, dan nomor dokumen di prototype ini adalah data simulasi. Syarat validasi selisih dan perlakuan residu menunggu keputusan workshop PWP dan Vendor ABC.</div>`}
function renderTransactionsTable(rows){return `<div class="table-wrap"><table class="tbl"><thead><tr><th>ID / Referensi</th><th>Tanggal</th><th>Vendor</th><th>Net / Sortir</th><th>Nilai PO ilustrasi</th><th>Status</th><th>Dokumen</th></tr></thead><tbody>${rows.length?rows.map(t=>`<tr onclick="openTx('${t.id}')"><td><span class="id">${escapeHtml(t.id)}</span><span class="minor">${escapeHtml(t.ref)}</span></td><td>${escapeHtml(shortDate(t.date))}</td><td>${escapeHtml(t.vendor)}</td><td><b>${num(net(t))} kg</b><span class="minor">Sortir ${num(totalQty(t))} kg</span></td><td class="num">${money(poAmount(t))}</td><td>${badge(t.status)}</td><td>${t.po?`<b style="color:#1f61b7">${escapeHtml(t.po)}</b>`:'—'}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">Tidak ada transaksi sesuai filter.</td></tr>`}</tbody></table></div>`}
function filters(){return `<div class="filters"><div class="search">${icon('search')}<input placeholder="Cari ID, vendor, referensi atau lot..." aria-label="Cari transaksi" value="${escapeHtml(state.search)}" oninput="setSearch(this.value)"></div><select aria-label="Filter status" class="select" onchange="setFilter(this.value)"><option value="all" ${state.filter==='all'?'selected':''}>Semua status</option>${Object.entries(labelStatus).map(([k,v])=>`<option value="${k}" ${state.filter===k?'selected':''}>${v}</option>`).join('')}</select></div>`}
function filtered(){return state.transactions.filter(t=>(state.filter==='all'||t.status===state.filter)&&[t.id,t.ref,t.vendor,t.lot].join(' ').toLowerCase().includes(state.search.toLowerCase()))}
function setSearch(s){state.search=s;const list=document.getElementById('listArea');if(list)list.innerHTML=renderTransactionsTable(filtered())}
function setFilter(s){state.filter=s;const list=document.getElementById('listArea');if(list)list.innerHTML=renderTransactionsTable(filtered())}
function pageTransactions(){return `${heading('SOURCE TRANSACTIONS','Jembatan timbang & hasil sortir','Kelola transaksi masuk dari kedua sistem Vendor ABC dan lihat hasil penghitungan berat serta struktur lot.',btnSimulator)}${filters()}<section class="card" id="listArea">${renderTransactionsTable(filtered())}</section><p class="footnote">Asumsi demo: kedua sumber dikonsolidasikan berdasarkan satu referensi transaksi sebelum masuk alur persetujuan. Mekanisme pencocokan aktual akan ditentukan bersama Vendor ABC.</p>`}
function validateChecks(t){let checks=[];let dup=state.transactions.some(x=>x.id!==t.id&&x.ref===t.ref);checks.push({ok:!!t.ref&&!dup,title:'Referensi unik',msg:dup?'Referensi sudah pernah diterima':'Referensi eksternal belum dipakai'});checks.push({ok:!!t.vendor&&!!t.date&&!!t.lot,title:'Identitas transaksi',msg:t.vendor&&t.date&&t.lot?'Vendor, tanggal, dan lot tersedia':'Vendor, tanggal, atau lot belum lengkap'});checks.push({ok:net(t)>0&&t.gross>t.tare,title:'Berat jembatan timbang',msg:`Gross ${num(t.gross)} − Tare ${num(t.tare)} = Net ${num(net(t))} kg`});checks.push({ok:totalQty(t)===net(t),title:'Rekonsiliasi berat (aturan demo)',msg:delta(t)===0?'Total sortir sesuai berat bersih':`Selisih sortir ${num(delta(t))} kg terhadap net ${num(net(t))} kg`});checks.push({ok:t.lines.some(l=>l.po)&&t.lines.filter(l=>l.po).every(l=>l.qty>0&&l.unitPrice>0),title:'Mapping produk & harga',msg:'Produk PO memiliki kuantitas dan harga satuan'});return checks}
function selectValidation(id){state.selected=id;render()}
function openTx(id){state.selected=id;goto('validation')}
function validateSelected(){let t=tx();if(['approved','synced','failed'].includes(t.status)){toast('Transaksi sudah melewati validasi. Lanjutkan proses atau gunakan Retry.');return}const checks=validateChecks(t);t.checks=checks;t.status=checks.every(c=>c.ok)?'pending':'blocked';addLog(t,t.status==='pending'?'Validasi otomatis selesai: semua pemeriksaan lolos':`Validasi tertahan: ${checks.filter(c=>!c.ok).map(c=>c.title).join(', ')}`);render();toast(t.status==='pending'?'Validasi berhasil. Lanjutkan persetujuan kedua pihak.':'Data ditahan: lihat hasil pemeriksaan.')}
function approve(who){const t=tx();if(t.status==='synced'||t.status==='blocked'||t.status==='received'||!validateChecks(t).every(c=>c.ok)){toast('Selesaikan validasi sebelum melakukan approval.');return}if(who==='vendor'){t.vendorApproved=true;addLog(t,'Vendor ABC menyatakan data final','Vendor ABC (simulasi)')}else{t.pwpApproved=true;addLog(t,'PWP menyetujui transaksi','PWP (simulasi)')}if(t.vendorApproved&&t.pwpApproved){t.status='approved';addLog(t,'Kedua pihak menyetujui. Transaksi siap dikirim')}render();toast('Persetujuan demo dicatat dalam audit trail.')}
function syncSelected(){const t=tx();if(!t.vendorApproved||!t.pwpApproved||!validateChecks(t).every(c=>c.ok)){toast('Perlu validasi dan approval kedua pihak sebelum sinkronisasi.');return}if(t.status==='synced'){toast('Transaksi sudah mempunyai PO; pengiriman ulang dicegah.');return}if(t.simFail&&!t.retried){t.status='failed';addLog(t,'Odoo Simulator: 503 Service Unavailable — transaksi belum dibuat','Odoo Simulator');render();toast('Simulasi kegagalan Odoo. Gunakan Retry untuk mencoba kembali.');return}t.status='synced';t.po=`PO-DEMO-${String(42+state.transactions.filter(x=>x.po).length).padStart(4,'0')}`;addLog(t,`Odoo Simulator membuat ${t.po} (respons mock)`, 'Odoo Simulator');render();toast(`${t.po} berhasil dibuat (simulasi, bukan Odoo nyata).`)}
function retrySelected(){const t=tx();if(t.status!=='failed'){toast('Retry hanya tersedia untuk transaksi gagal.');return}t.retried=true;addLog(t,'Retry idempoten dijalankan; endpoint simulasi pulih');syncSelected()}
function pageValidation(){const t=tx();let checks=validateChecks(t),ok=checks.every(c=>c.ok);return `${heading('DATA GATEKEEPER','Validasi & Approval','Periksa kesesuaian referensi, selisih berat, master data, lalu catat persetujuan kedua pihak sebelum pembuatan PO.',`<button class="btn" onclick="goto('transactions')">Lihat transaksi</button>${btnSimulator}`)}
<div class="filters"><span style="font-size:12px;color:#7b8ba5;font-weight:800">TRANSAKSI AKTIF</span><select class="select" aria-label="Pilih transaksi" onchange="selectValidation(this.value)">${state.transactions.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.id} · ${x.ref}</option>`).join('')}</select>${badge(t.status)}</div>
<div class="split"><div class="grid" style="align-content:start">
<section class="card section-pad"><div class="detail-head"><div><div class="eyebrow">RINGKASAN TRANSAKSI</div><h2>${escapeHtml(t.id)} <span style="font-size:11px;vertical-align:middle">${badge(t.status)}</span></h2><p>Referensi eksternal: ${escapeHtml(t.ref)}</p></div><span class="pill light">${escapeHtml(t.batch)}</span></div><hr class="divider"><dl class="info-grid"><div class="info"><dt>Vendor</dt><dd>${escapeHtml(t.vendor)}</dd></div><div class="info"><dt>Lot / tanggal</dt><dd>${escapeHtml(t.lot)} · ${shortDate(t.date)}</dd></div><div class="info"><dt>Gross</dt><dd>${num(t.gross)} kg</dd></div><div class="info"><dt>Tare</dt><dd>${num(t.tare)} kg</dd></div><div class="info"><dt>Net jembatan timbang</dt><dd class="big">${num(net(t))} kg</dd></div><div class="info"><dt>Total hasil sortir</dt><dd class="big" style="color:${delta(t)===0?'#13845c':'#c74753'}">${num(totalQty(t))} kg</dd></div></dl><hr class="divider"><div class="group-title">Detail hasil sortir</div><div class="table-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Jenis produk</th><th>Berat</th><th>Harga/kg</th><th>Perlakuan PO*</th></tr></thead><tbody>${t.lines.map(l=>`<tr style="cursor:default"><td><b>${escapeHtml(l.product)}</b></td><td>${num(l.qty)} kg</td><td>${l.po?money(l.unitPrice):'—'}</td><td>${l.po?'<span class="pill live">Item PO</span>':'<span class="pill light">Tidak masuk PO*</span>'}</td></tr>`).join('')}</tbody></table></div><div class="callout" style="margin-top:13px">*Perlakuan residu di luar PO hanya asumsi untuk demo. Jenis produk, harga, dan aturan kuantitas final perlu dikonfirmasi PWP.</div></section>
<section class="card section-pad"><div class="detail-head"><div><h3 style="margin:0;font-size:15px">Pemeriksaan otomatis</h3><p>Aturan validasi ilustratif yang bisa diuji secara langsung.</p></div><span class="pill ${ok?'live':'demo'}">${checks.filter(c=>c.ok).length}/${checks.length} lolos</span></div><hr class="divider"><div class="checks">${checks.map(c=>`<div class="check"><span class="check-ic ${c.ok?'':'no'}">${c.ok?'✓':'!'}</span><div><b>${escapeHtml(c.title)}</b><small>${escapeHtml(c.msg)}</small></div></div>`).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="validateSelected()" ${['approved','synced','failed'].includes(t.status)?'disabled':''}>${icon('shield')} Jalankan validasi</button></div></section></div>
<div class="grid" style="align-content:start"><section class="card section-pad"><div><h3 style="margin:0;font-size:15px">Persetujuan dua pihak</h3><p style="margin:4px 0 18px;color:var(--sub);font-size:11px">Tombol mensimulasikan keputusan. Bukan autentikasi atau token produksi.</p></div><div class="approval"><div class="approval-ic">VA</div><div><strong>Vendor ABC</strong><p>${t.vendorApproved?'Data dikonfirmasi final':'Menunggu konfirmasi vendor'}</p></div><div class="right">${t.vendorApproved?'<span class="pill live">✓ Disetujui</span>':`<button class="btn small" onclick="approve('vendor')" ${t.status!=='pending'?'disabled':''}>Setujui</button>`}</div></div><div class="approval"><div class="approval-ic">PW</div><div><strong>Tim PWP</strong><p>${t.pwpApproved?'Data disetujui PWP':'Menunggu persetujuan PWP'}</p></div><div class="right">${t.pwpApproved?'<span class="pill live">✓ Disetujui</span>':`<button class="btn small" onclick="approve('pwp')" ${t.status!=='pending'?'disabled':''}>Setujui</button>`}</div></div><button class="btn primary" style="width:100%;margin-top:8px" ${!(t.vendorApproved&&t.pwpApproved)||t.status==='synced'?'disabled':''} onclick="goto('integration')">Lanjut ke integrasi Odoo ${icon('arrow')}</button></section>
<section class="card section-pad"><h3 style="margin:0;font-size:15px">Timeline transaksi</h3><p style="font-size:11px;color:var(--sub);margin:5px 0 18px">Log yang terlihat dalam prototipe saat ini.</p><div class="timeline">${t.events.slice().reverse().map(e=>`<div class="tl-item"><b>${escapeHtml(e.text)}</b><p>${escapeHtml(e.by)}</p><time>${escapeHtml(e.at)}</time></div>`).join('')||'<p class="muted">Belum ada log.</p>'}</div></section></div></div>`}
function payload(t){return {external_po_number:t.ref,source:'Vendor ABC (demo)',vendor:t.vendor,order_date:t.date,lot_number:t.lot,bridge_weight:{gross_kg:t.gross,tare_kg:t.tare,net_kg:net(t)},line_items:t.lines.filter(l=>l.po).map(l=>({product:l.product,quantity_kg:l.qty,unit_price_idr:l.unitPrice})),sort_residue_kg:t.lines.filter(l=>!l.po).reduce((s,l)=>s+l.qty,0),total_idr:poAmount(t),batch_reference:t.batch,approval:{vendor_confirmed:t.vendorApproved,pwp_confirmed:t.pwpApproved}}}
function pageIntegration(){const t=tx();const synced=state.transactions.filter(x=>x.status==='synced');return `${heading('ERP CONNECTOR','Integrasi Odoo 16','Periksa payload sebelum pengiriman. Mode prototipe mengembalikan respons API tiruan dan nomor PO demo.',`<button class="btn" onclick="exportPayload()">Salin JSON payload</button>${btnSimulator}`)}
<div class="grid kpis" style="grid-template-columns:repeat(3,1fr)"><article class="card kpi"><div class="kpi-lbl">Target ERP</div><span class="icon-box">${icon('stack')}</span><div class="kpi-num" style="font-size:24px">Odoo 16</div><div class="kpi-note">Konektor mock · belum live</div></article><article class="card kpi"><div class="kpi-lbl">Jalur utama</div><span class="icon-box">${icon('link')}</span><div class="kpi-num" style="font-size:24px">JSON API</div><div class="kpi-note">HTTPS; CSV opsional (desain)</div></article><article class="card kpi"><div class="kpi-lbl">PO demo tercatat</div><span class="icon-box greenbox">${icon('check')}</span><div class="kpi-num">${synced.length}</div><div class="kpi-note">Pencatatan dalam memori browser</div></article></div>
<div class="filters"><span style="font-size:12px;color:#7b8ba5;font-weight:800">TRANSAKSI AKTIF</span><select class="select" onchange="selectValidation(this.value)" aria-label="Pilih transaksi">${state.transactions.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.id} · ${x.ref}</option>`).join('')}</select>${badge(t.status)}</div>
<div class="split"><div class="card section-pad"><div class="detail-head"><div><h3 style="margin:0;font-size:15px">Pratinjau payload</h3><p style="margin:5px 0 17px;color:var(--sub);font-size:11px">Contoh field middleware → mapping PO Odoo; bukan kontrak API final.</p></div><span class="pill light">${escapeHtml(t.ref)}</span></div><pre class="json">${escapeHtml(JSON.stringify(payload(t),null,2))}</pre><div class="callout" style="margin-top:13px">Contoh struktur ini masih konseptual. Field Odoo sebenarnya dan format API Vendor ABC akan ditetapkan dalam technical workshop.</div></div><div class="grid" style="align-content:start"><section class="card section-pad"><h3 style="margin:0 0 5px;font-size:15px">Kontrol sinkronisasi</h3><p style="margin:0 0 18px;font-size:11px;color:var(--sub)">Status dan respons Odoo di bawah ini adalah simulasi.</p>
<div class="check"><span class="check-ic ${validateChecks(t).every(x=>x.ok)?'':'no'}">${validateChecks(t).every(x=>x.ok)?'✓':'!'}</span><div><b>Validasi data</b><small>${validateChecks(t).every(x=>x.ok)?'Syarat demo terpenuhi':'Terdapat pemeriksaan yang gagal'}</small></div></div><div class="check" style="margin-top:9px"><span class="check-ic ${t.vendorApproved&&t.pwpApproved?'':'no'}">${t.vendorApproved&&t.pwpApproved?'✓':'!'}</span><div><b>Approval Vendor ABC & PWP</b><small>${t.vendorApproved&&t.pwpApproved?'Persetujuan kedua pihak dicatat':'Persetujuan belum lengkap'}</small></div></div>
<div class="preview-total" style="grid-template-columns:1fr;margin:17px 0"><div><span>Nilai PO ilustrasi</span><b>${money(poAmount(t))}</b></div><div><span>Kuantitas material di PO</span><b>${num(purchasedQty(t))} kg</b></div></div>
${t.status==='synced'?`<div class="callout"><strong>${escapeHtml(t.po)}</strong> berhasil dibuat oleh simulator Odoo. Pengiriman ulang dicegah berdasarkan referensi eksternal.</div>`:t.status==='failed'?`<div class="callout error"><strong>HTTP 503 (simulasi)</strong><br>Kegagalan sementara. Retry menggunakan referensi yang sama untuk demonstrasi idempotensi.</div>`:`<div class="callout">Jalur simulasi: finalisasi data → dua approval → kirim JSON → respons mock Odoo.</div>`}
<div class="actions" style="margin-top:16px"><button class="btn primary" onclick="syncSelected()" ${t.status!=='approved'?'disabled':''}>${icon('sync')} Kirim ke Odoo (demo)</button>${t.status==='failed'?`<button class="btn dark" onclick="retrySelected()">↻ Retry</button>`:''}</div><button class="btn small flat" style="margin-top:11px" onclick="goto('validation')">← Kembali ke validasi & approval</button></section></div></div>`}
function pageAudit(){return `${heading('TRACEABILITY / MONITORING','Audit Trail','Seluruh kejadian simulasi dicatat untuk mengilustrasikan penelusuran transaksi dan investigasi kegagalan.',`<button class="btn" onclick="exportLogs()">${icon('file')} Ekspor log (CSV)</button>`)}
<div class="card"><div class="card-header"><div><h3>Riwayat seluruh transaksi</h3><p>Jejak sistem, vendor dan operator pada data contoh.</p></div><span class="pill light">${state.logs.length} events</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Waktu</th><th>ID transaksi</th><th>Referensi eksternal</th><th>Pelaku</th><th>Peristiwa</th></tr></thead><tbody>${state.logs.map(e=>`<tr onclick="openTx('${e.tx}')"><td>${escapeHtml(e.at)}</td><td><span class="id">${escapeHtml(e.tx)}</span></td><td>${escapeHtml(e.ref)}</td><td>${escapeHtml(e.by)}</td><td>${escapeHtml(e.text)}</td></tr>`).join('')}</tbody></table></div></div><div class="callout" style="margin-top:16px"><strong>Untuk produksi:</strong> audit log persisten, autentikasi pengguna, kontrol izin, token otorisasi, retensi, dan penyimpanan immutable belum diimplementasikan pada prototype statis ini.</div>`}
function pageConfig(){return `${heading('TECHNICAL WORKSHOP','Field Mapping & Aturan Bisnis','Daftar field yang diturunkan dari dokumen kebutuhan PWP, ditampilkan berdampingan dengan asumsi yang perlu dikonfirmasi.',`<button class="btn primary" onclick="openSimulator()">${icon('plus')} Coba payload</button>`)}
<div class="grid twocol"><section class="card section-pad"><h3 style="margin:0 0 18px;font-size:15px">Sumber → Middleware → Odoo 16</h3><div class="table-wrap"><table class="tbl" style="min-width:620px"><thead><tr><th>Asal</th><th>Field</th><th>Tujuan / kegunaan</th></tr></thead><tbody>${[
['Jembatan timbang','Gross, berat truk, Net kg','Pencatatan & note kuantitas timbang'],['Sortir digital','Vendor, Lot Number, berat/produk','Konsolidasi transaksi dan qty reserved'],['Middleware','Nama vendor & vendor reference','Identitas PO'],['Middleware','Tanggal penerimaan','Tanggal transaksi'],['Middleware','Nama barang, Lot number','Detail produk & lot'],['Middleware','Qty reserved (kg sortir)','Kuantitas yang dipetakan ke Odoo'],['Middleware','Harga, Total','Harga satuan & nilai pesanan'],['Middleware','Attachment link (opsional)','URL lampiran'],['Middleware','Batch number / token otorisasi','Tracking dan persetujuan']].map(r=>`<tr style="cursor:default"><td style="color:#2459dd;font-weight:800">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>
<section class="grid" style="align-content:start"><section class="card section-pad"><div class="eyebrow">CONFIRMED FROM DOCUMENTS</div><h3 style="margin:0 0 13px;font-size:15px">Kebutuhan yang tercantum</h3>${['Odoo versi 16 sudah live, PO saat ini diinput manual.','Jembatan timbang + timbang digital / sortir dari Vendor ABC.','Diperlukan konfirmasi data final dari kedua pihak.','Batch number, token otorisasi dan audit trail.','Mirroring sebisa mungkin real-time; fallback batch selesai hari yang sama.','Target: dua minggu setelah aplikasi timbang digital vendor siap.'].map(x=>`<div class="check" style="margin-top:8px"><span class="check-ic">✓</span><div><b style="font-weight:650">${x}</b></div></div>`).join('')}</section>
<section class="card section-pad"><div class="eyebrow" style="color:#aa7926">TO CONFIRM</div><h3 style="margin:0 0 14px;font-size:15px">Keputusan untuk workshop</h3>${['Dasar pembentukan PO: net jembatan timbang atau qty hasil sortir?','RFQ draft atau PO langsung dikonfirmasi?','Definisi lot dan pemetaan qty reserved ke model Odoo.','Master vendor / produk, harga, satuan, dan toleransi selisih.','API Vendor ABC, keamanan & mekanisme retry.', 'Jenis approval, bentuk token, dan aturan lampiran.'].map(x=>`<div class="event"><div class="event-icon" style="color:#b77d1e;background:#fff2da">?</div><div><b style="font-weight:600">${x}</b></div></div>`).join('')}</section></section></div>`}
function openSimulator(){state.scenario='normal';document.getElementById('modal').classList.add('show');state.modal=true;renderSimulator()}
function closeModal(){document.getElementById('modal').classList.remove('show');state.modal=false}
const scenarioDesc={normal:'Lolos validasi; lanjut approval dan buat PO.',duplicate:'Referensi sudah ada sehingga transaksi ditahan.',mismatch:'Total sortir tidak sama dengan net timbang.',apierror:'Lolos validasi, tetapi simulasi Odoo gagal pertama kali.'};
function scenarioOptions(){return `<div class="group-title">Pilih skenario presentasi</div><div class="scenario-options">${[['normal','✓ Normal','Transaksi lengkap'],['duplicate','⊘ Duplikat','Referensi berulang'],['mismatch','△ Selisih berat','Perlu pengecekan'],['apierror','↻ Odoo unavailable','Uji error & retry']].map(([key,title,sub])=>`<button class="scenario ${state.scenario===key?'selected':''}" onclick="applyScenario('${key}')"><strong>${title}</strong><small>${sub}</small></button>`).join('')}</div>`}
function renderSimulator(){const n=state.seq,s=state.scenario,ref=(s==='duplicate'?'VABC-260923-001':`VABC-260923-${String(100+n).padStart(3,'0')}`);let form=`${scenarioOptions()}<div class="callout ${s==='duplicate'||s==='mismatch'?'warn':''}" style="margin-bottom:19px"><strong>Skenario:</strong> ${scenarioDesc[s]} Semua input dapat diubah sebelum dikirim.</div>
<div class="group-title">A. Jembatan timbang & identitas</div><div class="form-grid">
 <div class="field"><label for="fref">Referensi eksternal</label><input id="fref" value="${ref}" maxlength="50"></div>
 <div class="field"><label for="fvendor">Nama vendor</label><input id="fvendor" value="PT Contoh Material" maxlength="80"></div>
 <div class="field"><label for="fdate">Tanggal penerimaan</label><input id="fdate" type="date" value="2026-09-23"></div>
 <div class="field"><label for="flot">Lot Number</label><input id="flot" value="LOT-260923-${String(n).padStart(2,'0')}" maxlength="60"></div>
 <div class="field"><label for="fgross">Berat gross (kg)</label><input id="fgross" type="number" min="0" step="1" value="18600" oninput="updatePreview()"></div>
 <div class="field"><label for="ftare">Berat truk / tare (kg)</label><input id="ftare" type="number" min="0" step="1" value="8200" oninput="updatePreview()"></div></div>
<div class="form-subtitle">${icon('filter')} B. Hasil sortir digital</div><div class="line-grid"><div class="field"><label>Material</label><input value="PET" disabled></div><div class="field"><label for="qpet">Berat (kg)</label><input id="qpet" type="number" min="0" value="6500" oninput="updatePreview()"></div><div class="field"><label for="ppet">Harga / kg (Rp)</label><input id="ppet" type="number" min="0" value="5000" oninput="updatePreview()"></div><div class="field"><label>Masuk PO*</label><input value="Ya*" disabled></div>
<div class="field"><input aria-label="Material HDPE" value="HDPE" disabled></div><div class="field"><input aria-label="Berat HDPE" id="qhdpe" type="number" min="0" value="3200" oninput="updatePreview()"></div><div class="field"><input aria-label="Harga HDPE" id="phdpe" type="number" min="0" value="2500" oninput="updatePreview()"></div><div class="field"><input value="Ya*" aria-label="Masuk PO HDPE" disabled></div>
<div class="field"><input value="Residu" aria-label="Material residu" disabled></div><div class="field"><input id="qres" aria-label="Berat residu" type="number" min="0" value="${s==='mismatch'?'400':'700'}" oninput="updatePreview()"></div><div class="field"><input value="—" aria-label="Harga residu" disabled></div><div class="field"><input value="Tidak*" aria-label="Masuk PO residu" disabled></div></div>
<div class="form-subtitle">C. Pratinjau perhitungan</div><div class="preview-total"><div><span>Net jembatan timbang</span><b id="pnet">10.400 kg</b></div><div><span>Total hasil sortir</span><b id="psort">${s==='mismatch'?'10.100':'10.400'} kg</b></div><div><span>Estimasi nilai PO*</span><b id="pamount">Rp40.500.000</b></div></div>
<div style="font-size:10px;color:#8d9eb5;margin-top:11px">*Produk, harga dan perlakuan residu merupakan asumsi demonstrasi, bukan keputusan final PWP.</div>`;document.getElementById('modalBody').innerHTML=form;updatePreview()}
function applyScenario(s){state.scenario=s;renderSimulator()}
function resetSimulatorForm(){renderSimulator()}
function inputNum(id){return Number(document.getElementById(id)?.value||0)}
function updatePreview(){const g=inputNum('fgross'),t=inputNum('ftare'),q=inputNum('qpet')+inputNum('qhdpe')+inputNum('qres'),price=inputNum('qpet')*inputNum('ppet')+inputNum('qhdpe')*inputNum('phdpe');if(document.getElementById('pnet'))document.getElementById('pnet').textContent=num(g-t)+' kg';if(document.getElementById('psort'))document.getElementById('psort').textContent=num(q)+' kg';if(document.getElementById('pamount'))document.getElementById('pamount').textContent=money(price)}
function receiveTransaction(){let ids=['fref','fvendor','fdate','flot'];let vals=Object.fromEntries(ids.map(x=>[x,document.getElementById(x).value.trim()]));if(ids.some(x=>!vals[x])){toast('Lengkapi referensi, vendor, tanggal dan lot.');return}const quantityFields=['fgross','ftare','qpet','qhdpe','qres','ppet','phdpe'];if(quantityFields.some(id=>!Number.isFinite(inputNum(id))||inputNum(id)<0)){toast('Berat dan harga harus berupa angka positif.');return}let id='TRX-'+String(state.seq++).padStart(3,'0');let t=makeTx(id,vals.fref,'received',{vendor:vals.fvendor,date:vals.fdate,lot:vals.flot,gross:inputNum('fgross'),tare:inputNum('ftare'),batch:`BATCH-${vals.fdate.replaceAll('-','').slice(2)}-${String(state.seq).padStart(2,'0')}`,lines:[{product:'PET',qty:inputNum('qpet'),unitPrice:inputNum('ppet'),po:true},{product:'HDPE',qty:inputNum('qhdpe'),unitPrice:inputNum('phdpe'),po:true},{product:'Residu',qty:inputNum('qres'),unitPrice:0,po:false}],simFail:state.scenario==='apierror'});state.transactions.unshift(t);state.selected=id;addLog(t,'Data jembatan timbang & hasil sortir diterima dari Vendor ABC (simulasi)','Vendor ABC (simulasi)');closeModal();goto('validation');toast('Transaksi baru diterima. Jalankan validasi untuk melanjutkan.');}
async function exportPayload(){const data=JSON.stringify(payload(tx()),null,2);try{await navigator.clipboard.writeText(data);toast('JSON payload disalin ke clipboard.')}catch(e){const blob=new Blob([data],{type:'application/json'});download(blob,`payload-${tx().id}.json`);toast('Clipboard tidak tersedia; JSON diunduh sebagai file.')}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportLogs(){let rows=[['Waktu','Transaksi','Referensi','Pelaku','Peristiwa'],...state.logs.map(e=>[e.at,e.tx,e.ref,e.by,e.text])];const csv='\ufeff'+rows.map(r=>r.map(s=>'"'+String(s).replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'PWP-audit-trail-DEMO.csv');toast('Audit trail demo diekspor sebagai CSV.')}
function resetDemo(){if(!confirm('Reset seluruh transaksi simulasi ke keadaan awal?'))return;state.transactions=JSON.parse(JSON.stringify(pristineSeed));state.seq=5;state.selected='TRX-001';state.logs=state.transactions.flatMap(t=>t.events.map(e=>({tx:t.id,ref:t.ref,...e}))).reverse();state.search='';state.filter='all';render();toast('Demo kembali ke data awal.')}
(function init(){document.getElementById('todayLabel').textContent=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(new Date());render()})();
</script>
</body>
</html>
